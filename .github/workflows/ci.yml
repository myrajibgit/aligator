name: Flutter Build & Release

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"
  JAVA_VERSION: "17"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Analyze & Code Generation
  # ────────────────────────────────────────────────────────────────────────────
  analyze:
    name: Analyze & Code Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Restores generated Android/Gradle files when the repository does not
      # include the Gradle wrapper (for example, on a fresh source-only clone).
      - name: Ensure Android Gradle project exists
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test test/unit/

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build Android APK & App Bundle
  # ────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Restores generated Android/Gradle files when the repository does not
      # include the Gradle wrapper (for example, on a fresh source-only clone).
      - name: Ensure Android Gradle project exists & set executable permissions
        run: |
          flutter create --platforms=android .
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: flutter pub get

      # Setup Keystore if GitHub Secrets are provided
      - name: Setup Signing Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEY_STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Android APK (Installable on devices)
        run: flutter build apk --debug

      - name: Build Android Release App Bundle (Google Play Store)
        run: flutter build appbundle --release

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studycompete-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload Release AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: studycompete-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy Firebase backend and security configuration (on main push)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-firebase:
    name: Deploy Firebase Backend & Rules
    runs-on: ubuntu-latest
    needs: analyze
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Function dependencies
        run: npm ci
        working-directory: functions

      - name: Compile TypeScript
        run: npm run build
        working-directory: functions

      - name: Deploy functions, rules, indexes, and storage rules
        if: env.GCP_SA_KEY != ''
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore:rules,firestore:indexes,storage --project ${{ secrets.FIREBASE_PROJECT_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
