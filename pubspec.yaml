name: studycompete
description: Gamified study & compete platform for students.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4

  # Google Sign-In
  google_sign_in: ^6.2.1

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Image picker
  image_picker: ^1.1.2

  # Health/Fitness API
  health: ^10.2.0

  # Google ML Kit OCR (fallback)
  google_mlkit_text_recognition: ^0.13.0

  # Cloud Functions (for Gemini-powered study verification)
  cloud_functions: ^5.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  cached_network_image: ^3.3.1
  timeago: ^3.7.0
  shared_preferences: ^2.3.1
  google_fonts: ^6.2.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # build_runner: ^2.4.11
  # freezed: ^2.5.2
  # json_serializable: ^6.8.0
  # riverpod_generator: ^2.4.3
  # custom_lint: ^0.6.4
  # riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
